[project]
name = "spaceshare"
version = "0.1.0"
description = "A small storage-space marketplace for Nova SBE"
requires-python = ">=3.9"
dependencies = [
    "argon2-cffi>=23.1.0",
    "pillow>=10.0.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
